  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
      background: #fff6ec;
      color: #2b2118;
      font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    .app {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(120, 70, 20, 0.12);
    }
    h1 { margin: 0; text-align: center; font-size: 24px; }
    .sub { text-align: center; color: #8a7867; font-size: 14px; margin: 6px 0 20px; }
    h2 { font-size: 13px; color: #8a7867; margin: 18px 0 8px; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      border: 1px solid #ecd9c3;
      background: #fff;
      color: #5a4636;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
    }
    .chip.active { background: #ff8a3d; border-color: #ff8a3d; color: #fff; font-weight: 600; }

    .result {
      margin-top: 22px;
      min-height: 190px;
      border-radius: 16px;
      background: #fff1e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
    }
    .result .emoji { font-size: 56px; line-height: 1.1; }
    .result .name { font-size: 26px; font-weight: 700; margin-top: 8px; }
    .result .cat { font-size: 13px; color: #8a7867; margin-top: 4px; }
    .result.spinning .name { color: #b8a08a; }
    .placeholder { color: #b8a08a; font-size: 15px; }

    .blessing {
      margin-top: 14px;
      font-size: 15px;
      font-weight: 600;
      color: #e8590c;
      animation: pop 0.5s ease-out;
    }
    .blessing .heart {
      display: inline-block;
      color: #ff4d6d;
      animation: beat 1.2s ease-in-out infinite;
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(8px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    .btn-row { display: flex; gap: 8px; margin-top: 14px; }
    button.main {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #ff8a3d;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button.main:hover { background: #f27623; }
    button.main:disabled { background: #e3c7ad; cursor: default; }
    button.sub-btn {
      padding: 14px 16px;
      border: 1px solid #ecd9c3;
      border-radius: 12px;
      background: #fff;
      color: #5a4636;
      font-size: 14px;
      cursor: pointer;
    }
    button.sub-btn:hover { background: #fff6ec; }
    button.sub-btn:disabled { opacity: 0.5; cursor: default; }

    .add-row { display: flex; gap: 8px; }
    .add-row input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ecd9c3;
      border-radius: 8px;
      font-size: 14px;
      min-width: 0;
    }
    .add-row select {
      padding: 10px 8px;
      border: 1px solid #ecd9c3;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
    }
    .add-row button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #5a4636;
      color: #fff;
      cursor: pointer;
    }
    .history { font-size: 13px; color: #8a7867; line-height: 1.8; }
    .excluded-chip {
      display: inline-block;
      background: #f3ebe2;
      border-radius: 999px;
      padding: 3px 10px;
      margin: 2px 4px 2px 0;
      font-size: 12px;
      cursor: pointer;
    }
    .hint { font-size: 12px; color: #b8a08a; margin-top: 4px; }
    .total { text-align: center; font-size: 12px; color: #b8a08a; margin-top: 18px; }

      } catch (e) { return fallback; }
    }
    function save(key, value) {

        b.textContent = catEmoji[c] + " " + c;
        b.onclick = () => {
          selectedCats.has(c) ? selectedCats.delete(c) : selectedCats.add(c);
          save("selectedCats", Array.from(selectedCats));
          renderChips();
        };
        chipsEl.appendChild(b);
      });
    }

    function showMenu(m, isSpinning) {
      resultEl.classList.toggle("spinning", !!isSpinning);
      resultEl.innerHTML = "";
      const e = document.createElement("div");
      e.className = "emoji"; e.textContent = m.emoji || "🍽️";
      const n = document.createElement("div");
      n.className = "name"; n.textContent = m.name;
      const c = document.createElement("div");
      c.className = "cat"; c.textContent = m.cat;
      resultEl.append(e, n, c);

      // 룰렛이 멈췄을 때만 마지막 멘트 표시
      if (!isSpinning) {
        const b = document.createElement("div");
        b.className = "blessing";
        b.append(blessings[Math.floor(Math.random() * blessings.length)] + " ");
        const h = document.createElement("span");
        h.className = "heart";
        h.textContent = "♥";
        b.appendChild(h);
        resultEl.appendChild(b);
      }
    }

    function renderHistory() {
      historyEl.textContent = history.length
        ? history.slice(0, 5).join("  →  ")
        : "아직 기록이 없어요.";
    }

    function renderExcluded() {
      excludedEl.innerHTML = "";
      if (excluded.length === 0) {
        excludedEl.innerHTML = '<span class="history">없음</span>';
        return;
      }
      excluded.forEach(name => {
        const s = document.createElement("span");
        s.className = "excluded-chip";
        s.textContent = name + " ✕";
        s.onclick = () => {
          excluded = excluded.filter(x => x !== name);
          save("excludedMenus", excluded);
          renderExcluded();
        };
        excludedEl.appendChild(s);
      });
    }

    // ----- 추천하기 (룰렛 효과) -----
    pickBtn.addEventListener("click", () => {
      if (spinning) return;
      const list = pool();
      if (list.length === 0) {
        resultEl.classList.remove("spinning");
        resultEl.innerHTML = '<div class="placeholder">추천할 메뉴가 없어요.<br>종류를 바꾸거나 제외한 메뉴를 되돌려 보세요.</div>';
        current = null;
        banBtn.disabled = true;
        return;
      }

      spinning = true;
      pickBtn.disabled = true;
      banBtn.disabled = true;

      const final = list[Math.floor(Math.random() * list.length)];
      let step = 0;
      const total = 14;

      function tick() {
        if (step < total) {
          showMenu(list[Math.floor(Math.random() * list.length)], true);
          step++;
          setTimeout(tick, 60 + step * 18); // 점점 느려지는 효과
        } else {
          current = final;
          showMenu(final, false);
          history.unshift(final.name);
          history = history.slice(0, 20);
          save("menuHistory", history);
          renderHistory();
          spinning = false;
          pickBtn.disabled = false;
          pickBtn.textContent = "다시 추천받기";
          banBtn.disabled = false;
        }
      }
      tick();
    });

    // ----- 이건 싫어요 -----
    banBtn.addEventListener("click", () => {
      if (!current || spinning) return;
      if (!excluded.includes(current.name)) excluded.push(current.name);
      save("excludedMenus", excluded);
      renderExcluded();
      banBtn.disabled = true;
      pickBtn.click();
    });

    // ----- 메뉴 직접 추가 -----
    categories.forEach(c => {
      const o = document.createElement("option");
      o.value = c; o.textContent = c;
      newCat.appendChild(o);
    });

    function addMenu() {
      const name = newName.value.trim();
      if (!name) return;
      if (allMenus().some(m => m.name === name)) {
        newName.value = "";
        return;
      }
      customMenus.push({ name, emoji: catEmoji[newCat.value], cat: newCat.value });
      save("customMenus", customMenus);
      newName.value = "";
      renderTotal();
      resultEl.classList.remove("spinning");
      resultEl.innerHTML = "";
      const p = document.createElement("div");
      p.className = "placeholder";
      p.textContent = '"' + name + '" 추가됐어요! ✅';
      resultEl.appendChild(p);
    }
    document.getElementById("addBtn").addEventListener("click", addMenu);
    newName.addEventListener("keydown", e => { if (e.key === "Enter") addMenu(); });

    // ----- 시작 -----
    renderChips();
    renderHistory();
    renderExcluded();
    renderTotal();
  </script>
</body>
</html>
